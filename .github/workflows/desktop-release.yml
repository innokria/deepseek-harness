# Build and publish the Electron desktop app installers: a macOS .dmg per
# architecture (arm64/x64) and a Windows x64 NSIS installer. A tag push to
# dsh-v* (the desktop app shares the dsh family's version and tag) creates a
# GitHub Release with the installers; a manual dispatch can rehearse the build
# with publish=false or publish from such a tag.
#
# The macOS job signs with the Developer ID Application identity and notarizes
# via notarytool (credentials come from repository secrets); the Windows job
# stays unsigned until an Authenticode certificate is added. The auto-update
# feed stays out of scope for now.
name: Release (Desktop)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from the built installers. Only valid from a dsh-v* tag.
        required: true
        type: boolean
        default: false
  push:
    tags: ['dsh-v*']

permissions:
  contents: read

concurrency:
  # Pack runs per ref so a manual rehearse never displaces a tag push; the
  # release job below is the only step that writes and it targets one tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-macos:
    name: macOS (arm64 + x64 dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      # Import the Developer ID Application .p12 into a scratch keychain and
      # let codesign read the private key without prompting; electron-builder
      # resolves `mac.identity` against this default keychain.
      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_PASSWORD" build.keychain

      # electron-builder notarizes with notarytool; APPLE_API_KEY must name the
      # App Store Connect API key's .p8 file, so decode the secret to disk and
      # point the env var at it for the packaging steps.
      - name: Prepare notarization credentials
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      # dist:mac stages the self-contained runtime (both macOS Node runtimes +
      # the deployed harness) and builds the host-arch dmg; the second call
      # reuses that staged runtime to build the other architecture.
      - name: Package macOS (arm64)
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:mac

      - name: Package macOS (x64)
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --mac --x64

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows (x64 NSIS)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Package Windows
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Verify release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/dsh-v*) ;;
            *) echo "::error::release requires a dsh-v* tag, got ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${GITHUB_REF#refs/tags/dsh-v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" \
              --title "DeepSeek Harness Desktop ${version}" \
              --generate-notes \
              dist/*
          fi
