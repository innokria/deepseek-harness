appId: com.deepseek.dsh-desktop
productName: DeepSeek Harness
# Always suffix the architecture so the two macOS installers (arm64/x64) and the
# Windows installer are unambiguous on a release page.
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
files:
  - lib/**
  - preload.cjs
  - package.json
extraResources:
  - from: vendor/runtime
    to: runtime
  - from: vendor/harness
    to: harness
asar: true
# The shell has no in-process native dependencies — the harness runs as a
# child process on its bundled Node — so skip electron-builder's dependency
# rebuild (which would otherwise re-run `pnpm install --production` and trip
# the workspace's postinstall).
npmRebuild: false
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # The Developer ID Application identity signs the distribution build; the
  # same identity is notarized via `notarytool` (credentials come from the
  # release workflow's environment).
  identity: "Junwei Zhang (7HP3X3977Y)"
  notarize: true
  target:
    - dmg
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
